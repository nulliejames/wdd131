<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Share feedback on product quality, installation, and useful features with this WDD131 product review form.">
    <meta name="author" content="Nullie James">
    <title>Product Review | WDD131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <p class="required-note"><span aria-hidden="true">*</span> Required fields</p>
        <form action="review.html" method="get">
            <label for="product">Product Name <span class="required" aria-hidden="true">*</span></label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating-options">
                <legend>Overall Rating <span class="required" aria-hidden="true">*</span></legend>
                <div class="rating-list">
                    <label for="rating-1"><input type="radio" id="rating-1" name="rating" value="1" required> <span
                            aria-hidden="true">☆</span> <span class="visually-hidden">1 star</span></label>
                    <label for="rating-2"><input type="radio" id="rating-2" name="rating" value="2" required> <span
                            aria-hidden="true">☆☆</span> <span class="visually-hidden">2 stars</span></label>
                    <label for="rating-3"><input type="radio" id="rating-3" name="rating" value="3" required> <span
                            aria-hidden="true">☆☆☆</span> <span class="visually-hidden">3 stars</span></label>
                    <label for="rating-4"><input type="radio" id="rating-4" name="rating" value="4" required> <span
                            aria-hidden="true">☆☆☆☆</span> <span class="visually-hidden">4 stars</span></label>
                    <label for="rating-5"><input type="radio" id="rating-5" name="rating" value="5" required> <span
                            aria-hidden="true">☆☆☆☆☆</span> <span class="visually-hidden">5 stars</span></label>
                </div>
            </fieldset>

            <label for="installation-date">Date of Installation <span class="required"
                    aria-hidden="true">*</span></label>
            <input type="date" id="installation-date" name="installation-date" required>

            <fieldset class="features-options">
                <legend>Which features did you find useful in the product? <span class="optional">(Check all that
                        apply)</span></legend>
                <label for="durability"><input type="checkbox" id="durability" name="features" value="Durability">
                    Durability</label>
                <label for="ease-of-use"><input type="checkbox" id="ease-of-use" name="features" value="Ease of Use">
                    Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="features" value="Performance">
                    Performance</label>
                <label for="design"><input type="checkbox" id="design" name="features" value="Design"> Design</label>
            </fieldset>

            <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="written-review" name="written-review" rows="5"></textarea>

            <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="user-name" name="user-name" autocomplete="name">

            <input class="submit-button" type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> 🌳 Nullie James 🌳 Freetown, Sierra Leone</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
